name: GrowthFlow Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r engine/requirements-test.txt

      - name: Run backend tests
        run: python -m pytest -q engine/test_main.py
